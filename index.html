<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are we moz-src:// yet?</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Are we moz-src:// yet?</h1>
    </div>

    <div class="charts-grid">
      <div class="chart-container" id="testFailureContainer">
        <div class="chart-header">
          <h2 id="test-failures">Percentage of moz-src files</h2>
          <p class="info-text">
            Vs extra JS modules and actors, click a marked point to list the
            modules it added to EXTRA_JS_MODULES
          </p>
        </div>
      <div id="testFailureChart"></div>
      <div id="changeDetails" class="change-details"></div>
    </div>

    <div id="errorMessage" class="error" style="display: none;"></div>

    <script>

      async function load(file) {
        let resp = await fetch(file);
        if (resp.ok) {
          return resp.json();
        }
      }

      const VARIABLES = [
        "MOZ_SRC_FILES",
        "EXTRA_JS_MODULES",
        "EXTRA_PP_JS_MODULES",
        "ACTORS",
      ];

      const TRACKED_VARIABLE = "EXTRA_JS_MODULES";

      const MAX_FILES_IN_TOOLTIP = 5;

      function summariseAdded(added) {
        if (!added.length) {
          return "";
        }
        let lines = [`<br>${added.length} added to ${TRACKED_VARIABLE}`];
        for (let file of added.slice(0, MAX_FILES_IN_TOOLTIP)) {
          lines.push(file);
        }
        if (added.length > MAX_FILES_IN_TOOLTIP) {
          lines.push(`… and ${added.length - MAX_FILES_IN_TOOLTIP} more`);
        }
        return lines.join("<br>");
      }

      function showAddedDetails(obj, previousBuildId, added) {
        let details = document.getElementById("changeDetails");
        let date = new Date(obj.commit_date * 1000).toLocaleDateString();
        let list = path => `
          <li class="added">
            <a href="https://searchfox.org/firefox-main/source/${path}"
               target="_blank" rel="noopener">${path}</a>
          </li>`;
        details.innerHTML = `
          <h3>${added.length} added to ${TRACKED_VARIABLE} in ${obj.build_id} (${date})</h3>
          <p class="info-text">Since build ${previousBuildId}</p>
          <ul class="change-list">${added.map(list).join("")}</ul>`;
        details.classList.add("visible");
        details.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      (async () => {
        let data = await load("data.json");
        let moduleChanges = await load("module-changes.json") ?? {};

        data.sort((a, b) => b.commit_date - a.commit_date);

        let addedBy = obj => {
          let entry = moduleChanges[obj.build_id];
          let added = entry?.changes?.[TRACKED_VARIABLE]?.added ?? [];
          return added.length ? { added, previous_build_id: entry.previous_build_id } : null;
        };

        let dates = data.map(obj => new Date(obj.commit_date * 1000));

        let makeData = name => {
          let trace = {
            x: dates,
            y: data.map(obj => obj[name]),
            hovertemplate: `%{y} ${name}<br>%{x|%d %b %Y}<extra></extra>`,
            mode: 'lines',
            name: name
          };
          if (name === TRACKED_VARIABLE) {
            trace.text = data.map(obj => summariseAdded(addedBy(obj)?.added ?? []));
            trace.hovertemplate = `%{y} ${name}<br>%{x|%d %b %Y}%{text}<extra></extra>`;
            trace.mode = 'lines+markers';
            trace.marker = { size: data.map(obj => addedBy(obj) ? 6 : 0) };
          }
          return trace;
        };

        let graphData = VARIABLES.map(makeData);

        const jobLayout = {
          xaxis: { title: 'Date', type: 'date' },
          yaxis: {
            title: 'File Count',
            rangemode: 'tozero'
          },
          hovermode: 'closest',
          showlegend: true,
          margin: { l: 60, r: 40, t: 20, b: 60 },
          hoverlabel: {
            bgcolor: '#2a2a2a',
            bordercolor: '#2a2a2a',
            align: 'left',
            font: {
              size: 15,
              color: 'white',
              family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
            }
          }
        };

        let chart = document.getElementById('testFailureChart');
        Plotly.newPlot(chart, graphData, jobLayout, { responsive: true });

        let setPointer = pointer => {
          let dragLayer = chart.querySelector('.nsewdrag');
          if (!dragLayer) {
            return;
          }
          if (pointer) {
            // Plotly marks its own cursor as important, so we have to as well.
            dragLayer.style.setProperty('cursor', 'pointer', 'important');
          } else {
            dragLayer.style.removeProperty('cursor');
          }
        };

        chart.on('plotly_hover', event => {
          let { curveNumber, pointIndex } = event.points[0];
          setPointer(
            VARIABLES[curveNumber] === TRACKED_VARIABLE && addedBy(data[pointIndex])
          );
        });

        chart.on('plotly_unhover', () => setPointer(false));

        chart.on('plotly_click', event => {
          let { curveNumber, pointIndex } = event.points[0];
          if (VARIABLES[curveNumber] !== TRACKED_VARIABLE) {
            return;
          }
          let obj = data[pointIndex];
          let change = addedBy(obj);
          if (change) {
            showAddedDetails(obj, change.previous_build_id, change.added);
          }
        });
      })();

    </script>
</body>
</html>
